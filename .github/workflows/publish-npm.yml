name: Publish npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to align npm version (for example v0.1.0-alpha.9)
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/termvox
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Use npm with trusted publishing support
        run: npm install -g npm@latest
      - name: Resolve package version from tag
        id: meta
        working-directory: .
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          node -e "
            const fs = require('fs');
            const path = 'packages/termvox/package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.version = process.argv[1];
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          " "$version"
      - name: Install editor build deps
        run: npm ci --prefix editor
      - name: Build bundled editor extension
        run: npm run build:editor
      - name: Test npm package
        run: npm test
      - run: TERMVOX_SKIP_BINARY_INSTALL=1 npm pack
      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish --access public --tag alpha
      - name: Promote published version to latest dist-tag
        run: npm dist-tag add "termvox@$(node -p "require('./package.json').version")" latest
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
