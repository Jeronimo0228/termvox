name: Publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (for example v0.1.0-alpha.1)
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/dist/termvox
            extension: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/dist/termvox
            extension: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/dist/termvox
            extension: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/dist/termvox.exe
            extension: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libasound2-dev
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0
        with:
          key: publish-${{ matrix.target }}
      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install cmake ninja llvm -y --no-progress
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WHISPER_DONT_GENERATE_BINDINGS=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build locked release binary
        run: cargo build --profile dist --locked --target ${{ matrix.target }} --bin termvox
      - name: Set reproducible build timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Package reproducibly
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          asset="termvox-v${VERSION}-${TARGET}.${EXTENSION}"
          scripts/package-release.sh "$BINARY" "dist/$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
      - name: Generate CycloneDX SBOM
        id: sbom
        uses: anchore/sbom-action@v0
        continue-on-error: true
        with:
          path: ${{ matrix.binary }}
          format: cyclonedx-json
          output-file: dist/${{ steps.package.outputs.asset }}.cdx.json
          upload-artifact: false
      - name: Fallback SBOM when syft is unavailable
        if: steps.sbom.outcome != 'success'
        shell: bash
        env:
          ASSET: ${{ steps.package.outputs.asset }}
        run: |
          python3 -c 'import json,sys; json.dump({"bomFormat":"CycloneDX","specVersion":"1.5","version":1,"components":[]}, open(sys.argv[1], "w"), indent=2)' \
            "dist/${ASSET}.cdx.json"
      - uses: sigstore/cosign-installer@v3
      - name: Keyless-sign archive
        shell: bash
        env:
          ASSET: ${{ steps.package.outputs.asset }}
        run: cosign sign-blob --yes --bundle "dist/${ASSET}.sigstore.json" "dist/${ASSET}"
      - name: Create per-platform checksums
        shell: bash
        env:
          ASSET: ${{ steps.package.outputs.asset }}
        run: cd dist && sha256sum "$ASSET" > "$ASSET.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish GitHub release
    needs: build
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Ensure release artifacts exist
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/termvox-v*.tar.gz dist/termvox-v*.zip)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No release artifacts were uploaded; skipping publish."
            exit 1
          fi
          printf 'Found %s artifact(s)\n' "${#files[@]}"
      - uses: sigstore/cosign-installer@v3
      - run: scripts/verify-release.sh dist
      - run: scripts/verify-release.sh --write-checksums dist
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --repo "${{ github.repository }}" --clobber
          else
            gh release create "$tag" dist/* \
              --repo "${{ github.repository }}" \
              --title "TermVox $tag" \
              --notes-file docs/release-notes-template.md \
              --verify-tag
          fi
