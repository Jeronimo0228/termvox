name: Release dry run

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: main
      version:
        description: Release version (for example, 0.1.0-alpha.1)
        required: true

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: release-dry-run-${{ inputs.ref }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/dist/termvox
            extension: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/dist/termvox
            extension: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/dist/termvox.exe
            extension: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libasound2-dev
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          key: dist-${{ matrix.target }}
      - name: Validate version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/release-dry-run.sh --validate-version "$VERSION"
      - name: Build locked release binary
        run: cargo build --profile dist --locked --target ${{ matrix.target }} --bin termvox
      - name: Set reproducible build timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Package reproducibly
        id: package
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          asset="termvox-v${VERSION}-${TARGET}.${EXTENSION}"
          scripts/package-release.sh "$BINARY" "dist/$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
      # This major tag is intentionally tracked by Dependabot until an
      # immutable upstream SHA is recorded in a reviewed update.
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ${{ matrix.binary }}
          format: cyclonedx-json
          output-file: dist/${{ steps.package.outputs.asset }}.cdx.json
          upload-artifact: false
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Keyless-sign archive
        shell: bash
        env:
          ASSET: ${{ steps.package.outputs.asset }}
        run: cosign sign-blob --yes --bundle "dist/${ASSET}.sigstore.json" "dist/${ASSET}"
      - name: Create per-platform checksums
        shell: bash
        env:
          ASSET: ${{ steps.package.outputs.asset }}
        run: cd dist && sha256sum "$ASSET" > "$ASSET.sha256"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  bundle:
    name: verify release bundle
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Verify signatures, SBOMs, and archives
        shell: bash
        run: scripts/verify-release.sh dist
      - name: Write aggregate checksums
        shell: bash
        run: scripts/verify-release.sh --write-checksums dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: termvox-v${{ inputs.version }}-release-bundle
          path: dist/*
          if-no-files-found: error
          retention-days: 14
