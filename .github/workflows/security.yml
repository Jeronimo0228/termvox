name: Supply-chain security

on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
      - deny.toml
      - .github/workflows/security.yml
  pull_request:
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
      - deny.toml
      - .github/workflows/security.yml
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Kept on a major tag because no project-owned immutable SHA is available.
      # Dependabot tracks GitHub Actions updates in this repository.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  rustsec:
    name: RustSec audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # The advisory database is refreshed by the action on every run.
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ github.token }}
