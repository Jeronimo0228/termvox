version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Bogota
    open-pull-requests-limit: 10
    labels: [dependencies, rust]
    commit-message:
      prefix: deps

  # This also updates actions intentionally left on reviewed major tags when
  # an immutable upstream commit has not yet been recorded.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: America/Bogota
    open-pull-requests-limit: 10
    labels: [dependencies, ci]
    commit-message:
      prefix: ci
