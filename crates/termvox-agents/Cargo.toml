tokio = { version = "1.53.1", features = ["process", "io-util", "time", "rt", "macros", "sync"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = "0.1.44"
termvox-core = { version = "0.1.0-alpha.10", path = "../termvox-core" }
which = "8.0.5"

[lints]
workspace = true
