[package]
name = "termvox-plugin-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Typed JSON-RPC plugin protocol and SDK for TermVox"
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["src/**", "examples/**", "schema/**", "Cargo.toml", "../../README.md", "../../LICENSE-MIT", "../../LICENSE-APACHE"]

[dependencies]
async-trait = "0.1.91"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["fs", "io-util", "io-std", "process", "sync", "time", "macros", "rt"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
termvox-core = { version = "0.1.0-alpha.11", path = "../termvox-core" }

[lints]
workspace = true
