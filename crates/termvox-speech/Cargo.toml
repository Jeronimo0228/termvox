[package]
name = "termvox-speech"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Managed local and remote speech-to-text providers for TermVox"
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["src/**", "models/**", "Cargo.toml", "../../README.md", "../../LICENSE-MIT", "../../LICENSE-APACHE"]

[dependencies]
async-trait = "0.1.91"
hex = "0.4.3"
reqwest = { version = "0.13.4", features = ["json", "multipart", "rustls"] }
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["fs", "process", "io-util", "time", "macros", "rt"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = "0.1.44"
termvox-core = { version = "0.1.0-alpha.13", path = "../termvox-core" }
whisper-rs = { version = "0.16.0", optional = true }

[lints]
workspace = true

[features]
default = ["embedded-whisper"]
embedded-whisper = ["dep:whisper-rs"]
