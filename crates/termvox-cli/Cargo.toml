[package]
name = "termvox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Voice-driven bridge for coding-agent command-line interfaces"
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["src/**", "Cargo.toml", "../../README.md", "../../LICENSE-MIT", "../../LICENSE-APACHE"]

[[bin]]
name = "termvox"
path = "src/main.rs"

[features]
default = ["native-audio", "embedded-whisper"]
embedded-whisper = ["termvox-speech/embedded-whisper"]
native-audio = ["termvox-audio/native-audio"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
clap_complete = "4.6.0"
clap_mangen = "0.2.33"
crossterm = "0.29.0"
dirs = "6.0.0"
serde = { version = "1.0.151", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
toml = "1.1.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
arboard = "3.6.1"
termvox-agents = { version = "0.1.0-alpha.13", path = "../termvox-agents" }
termvox-audio = { version = "0.1.0-alpha.13", path = "../termvox-audio", default-features = false }
termvox-core = { version = "0.1.0-alpha.13", path = "../termvox-core" }
termvox-plugin-sdk = { version = "0.1.0-alpha.13", path = "../termvox-plugin-sdk" }
termvox-speech = { version = "0.1.0-alpha.13", path = "../termvox-speech", default-features = false }
termvox-hotkeys = { version = "0.1.0-alpha.13", path = "../termvox-hotkeys" }
portable-pty = "0.9.0"

[lints]
workspace = true
