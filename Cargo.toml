[workspace]
members = [
    "crates/termvox-core",
    "crates/termvox-audio",
    "crates/termvox-speech",
    "crates/termvox-agents",
    "crates/termvox-plugin-sdk",
    "crates/termvox-cli", "crates/termvox-hotkeys",
]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.7"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Jeronimo Restrepo Angel"]
repository = "https://github.com/Jeronimo0228/termvox"
homepage = "https://github.com/Jeronimo0228/termvox"
documentation = "https://docs.rs/termvox"
readme = "README.md"
keywords = ["voice", "speech-to-text", "cli", "developer-tools", "accessibility"]
categories = ["command-line-utilities", "development-tools", "accessibility"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[profile.dist]
inherits = "release"
lto = "fat"

[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = ["shell", "powershell", "homebrew"]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
pr-run-mode = "plan"
install-path = "CARGO_HOME"
